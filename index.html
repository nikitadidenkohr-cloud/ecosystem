<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Vietnam изнутри — объявления, сервисы и всё для жизни во Вьетнаме">
<meta name="theme-color" content="#2C3E2D">
<title>Vietnam изнутри</title>
<!-- Telegram Mini App SDK: должен стоять первым скриптом -->
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: одна колонка шириной телефона, нижняя панель вкладок, карточки товаров сеткой 2×N, детали открываются шторкой снизу */
:root{
  --bg:#F3F5EC; --surface:#FFFFFF; --surface-2:#E8ECDD; --fg:#1C2A1E; --muted:#5F6C5F;
  --brand:#2C3E2D; --lime:#D6EB4F; --lime-ink:#1C2A1E; --line:#D9DFCB; --danger:#B4452F; --ok:#2F7A44;
  --ad:#FFF6D6; --ad-line:#EADBA0;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141C15; --surface:#1E2A1F; --surface-2:#273628; --fg:#ECF1E2; --muted:#9DAA9B;
  --brand:#2C3E2D; --lime:#D6EB4F; --lime-ink:#1C2A1E; --line:#304130; --danger:#E07A63; --ok:#7CC48F;
  --ad:#2E2C1C; --ad-line:#4A4528; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141C15; --surface:#1E2A1F; --surface-2:#273628; --fg:#ECF1E2; --muted:#9DAA9B;
  --brand:#2C3E2D; --lime:#D6EB4F; --lime-ink:#1C2A1E; --line:#304130; --danger:#E07A63; --ok:#7CC48F;
  --ad:#2E2C1C; --ad-line:#4A4528; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));position:relative}
.wrap{padding-inline:16px}

/* шапка */
.top{background:var(--brand);color:#ECF1E2;padding:14px 16px 18px;border-radius:0 0 22px 22px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--lime);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.city{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:7px 11px;border-radius:999px;font-weight:700;font-size:13px;color:#ECF1E2}
.city select{background:transparent;border:0;color:inherit;font:inherit;appearance:none;padding-right:2px}
.city select option{color:#1C2A1E}
.search{margin-top:14px;display:flex;gap:8px}
.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:12px 14px;font:inherit;background:#ECF1E2;color:#1C2A1E}
.cur{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.cur button{padding:0 10px;border-radius:9px;font-weight:800;font-size:13px;color:#ECF1E2}
.cur button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}

/* чипы категорий */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* баннер переезда */
.moving{margin:12px 16px 4px;display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--lime);color:var(--lime-ink);text-align:left;width:calc(100% - 32px)}
.moving b{font-family:var(--f-display);font-size:14px;font-weight:700;display:block;line-height:1.2}
.moving span{font-size:13px;font-weight:600}
.moving .n{margin-left:auto;font-family:var(--f-display);font-size:22px;font-weight:700}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 16px 8px}
.sec-h h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0}
.sec-h span{color:var(--muted);font-size:13px;font-weight:600}

/* сетка товаров */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-inline:16px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;min-width:0}
.ph{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;position:relative}
.ph svg{width:46%;height:46%}
.badge{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--lime);color:var(--lime-ink)}
.badge.res{background:#1C2A1E;color:#ECF1E2}
.fav{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center}
.fav svg{width:17px;height:17px}
.card-b{padding:9px 10px 11px;display:grid;gap:2px;min-width:0}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.title{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--muted)}
.card.vip{outline:2px solid var(--lime);outline-offset:-2px}

/* рекламная карточка */
.ad{grid-column:1/-1;background:var(--ad);border:1px solid var(--ad-line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;text-align:left}
.ad .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--brand);display:grid;place-items:center}
.ad .ic svg{width:26px;height:26px}
.ad b{display:block;font-size:14px}
.ad p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ad .tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* нижние вкладки */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:64px;align-items:center}
.tab{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--fg)}
.tab.plus span{width:46px;height:46px;border-radius:15px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}

/* шторка */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,10,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:480px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;z-index:2}
.big-ph{aspect-ratio:4/3;max-width:100%;margin:12px 16px 0;border-radius:var(--r);display:grid;place-items:center;position:relative}
.big-ph svg{width:34%;height:34%}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}.dots i:first-child{background:#fff}
.d-h{padding:14px 16px 0}
.d-h h3{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
.conv{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-variant-numeric:tabular-nums}
.conv b{font-size:22px}
.conv span{color:var(--muted);font-weight:700;font-size:14px;align-self:flex-end;padding-bottom:3px}
.rate-note{font-size:12px;color:var(--muted);margin-top:4px}
.box{margin:12px 16px 0;background:var(--surface);border-radius:var(--r);padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.seller{display:flex;gap:12px;align-items:center}
.ava{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--lime);font-family:var(--f-display);font-weight:700;display:grid;place-items:center;flex:none}
.seller b{display:block}.seller small{color:var(--muted);font-size:13px}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ok)}
.safe{background:var(--brand);color:#ECF1E2}
.safe h4{margin:0;font-family:var(--f-display);font-size:14px;color:var(--lime)}
.safe p{margin:6px 0 10px;font-size:13px;opacity:.9}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;font-weight:600}
.steps div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px}
.steps div b{display:block;color:var(--lime);font-size:13px}
.actions{position:sticky;bottom:0;display:flex;gap:8px;padding:14px 16px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:15px;text-align:center}
.btn.pri{background:var(--lime);color:var(--lime-ink)}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.btn.dark{background:var(--fg);color:var(--bg)}

/* формы */
.form{display:grid;gap:14px;padding:16px}
.form h2{font-family:var(--f-display);font-size:18px;margin:0}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px;font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.upl div{aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:22px}
.upl div:first-child{background:var(--surface-2);border-style:solid;font-size:12px;font-weight:700;text-align:center;padding:4px}
.ai{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px}
.ai b{display:block;font-size:14px}
.ai .spark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--lime);display:grid;place-items:center;color:var(--lime-ink);font-weight:800}
.boosts{display:grid;gap:8px}
.boost{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.boost[aria-pressed="true"]{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.boost b{display:block;font-size:14px}.boost small{color:var(--muted);font-size:12px}
.boost .p{margin-left:auto;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}

/* профиль */
.p-head{display:flex;gap:14px;align-items:center;padding:16px}
.p-head .ava{width:58px;height:58px;font-size:20px}
.p-head h2{margin:0;font-family:var(--f-display);font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-inline:16px}
.stats div{background:var(--surface);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px;font-weight:600}
.list{display:grid;gap:8px;padding-inline:16px}
.li{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px;text-align:left;width:100%}
.li .mini{width:54px;height:54px;border-radius:10px;flex:none;display:grid;place-items:center}
.li .mini svg{width:55%;height:55%}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;background:var(--surface-2);white-space:nowrap}
.pill.on{background:var(--lime);color:var(--lime-ink)}
.saved{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px}
.saved b{display:block;font-size:14px}.saved small{color:var(--muted);font-size:12px}
.saved .bell{margin-left:auto;font-size:12px;font-weight:800;color:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.feat{display:grid;gap:10px;padding:0 16px}
.feat div{background:var(--surface);border-radius:14px;padding:12px 14px}
.feat b{display:block;font-size:14px}.feat p{margin:3px 0 0;font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.proto{font-size:11px;text-align:center;color:var(--muted);padding:18px 16px 6px}

/* ---- Telegram-версия ---- */
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.top{padding-top:calc(14px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.tabs{padding-bottom:max(env(safe-area-inset-bottom,0px), var(--tg-safe-area-inset-bottom,0px))}
.in-tg .actions, .in-tg #publish{display:none}
.in-tg .app{padding-bottom:calc(76px + var(--tg-safe-area-inset-bottom,0px))}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 0}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:19px;height:19px}
.sheet .x{position:static}
.upl label,.upl .pv{aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;overflow:hidden;position:relative}
.upl label{background:var(--surface-2);border:1.5px dashed var(--line);color:var(--muted);font-size:12px;font-weight:700;text-align:center;padding:4px;cursor:pointer}
.upl .pv img{width:100%;height:100%;object-fit:cover}
.upl .pv button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.hint{font-size:12px;color:var(--muted)}
.demo{display:inline-block;margin-left:6px;font-family:var(--f-body);font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:var(--lime);color:var(--lime-ink);vertical-align:middle}
.p-head .ava img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.upl .pv{border:0;background:var(--surface-2)}

/* всё строго в ширину экрана */
html,body{max-width:100%;overflow-x:hidden}
.list,.feat,.boosts{grid-template-columns:minmax(0,1fr)}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.li,.saved,.boost{min-width:0;max-width:100%}
.saved>span,.boost>span:first-child{min-width:0}
/* ---- реальные данные ---- */
.ph.has-img{background:var(--surface-2)}
.ph.has-img img,.mini.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.li .mini{overflow:hidden}
.st.on{color:var(--ok);font-weight:700}.st.warn{color:var(--danger);font-weight:700}
.pill.warn{background:var(--danger);color:#fff}
.li.mine{flex-direction:column;align-items:stretch;gap:8px}
.li.mine .row{display:flex;gap:12px;align-items:center;text-align:left;min-width:0;width:100%}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts .pill{padding:6px 10px;font-size:12px}
.acts-big{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:12px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding:12px 16px 0;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);scroll-snap-align:center;background:var(--surface-2)}
.gal-n{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.desc{margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.row-links{display:flex;justify-content:space-between;flex-direction:row;padding-top:10px;padding-bottom:0}
.link{font-size:14px;font-weight:700;color:var(--muted);padding:6px 0}
.fav-link.on{color:var(--danger)}
.more{display:flex;justify-content:center;padding:14px 16px}
.more .btn{flex:0 1 auto;padding:12px 22px}
.btn[disabled]{opacity:.5;cursor:default}
.skel .ph{background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
.skel .card-b i{display:block;height:12px;border-radius:6px;background:var(--surface-2);margin:4px 0}
.skel .card-b i+i{width:60%}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.skel .ph{animation:none}}
.stats{margin-bottom:4px}
.box.safe+.box.safe{margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Разделы"><div class="tabs-in" id="tabs"></div></nav>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* =====================================================================
   НАСТРОЙКИ
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://rzoacytvcepyzmanajcd.supabase.co",       // https://xxxx.supabase.co
  SUPABASE_KEY: "sb_publishable_F0qoT98Wit7i61CGSqI7rQ_z0T4HdUS",  // публичный anon / publishable ключ (его можно светить)
  BOT_USERNAME: "vietnam_iznutri_bot",
  APP_SHORTNAME: "app"
};
const CONFIGURED = /^https:\/\/.+/.test(CONFIG.SUPABASE_URL);

/* ---------- Telegram SDK ---------- */
const TG = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;
const ver = v => !!(TG && TG.isVersionAtLeast && TG.isVersionAtLeast(v));
const safe = fn => { try { return fn(); } catch (e) {} };
const USER = TG && TG.initDataUnsafe && TG.initDataUnsafe.user || null;

function applyTheme(){
  if (TG) document.documentElement.dataset.theme = TG.colorScheme === "dark" ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#F3F5EC";
  if (ver("6.1")) safe(()=>{ TG.setHeaderColor("#2C3E2D"); TG.setBackgroundColor(bg); });
  if (ver("7.10")) safe(()=>TG.setBottomBarColor(bg));
}
if (TG) {
  document.documentElement.classList.add("in-tg");
  safe(()=>TG.ready()); safe(()=>TG.expand());
  if (ver("7.7")) safe(()=>TG.disableVerticalSwipes());
  applyTheme(); safe(()=>TG.onEvent("themeChanged", applyTheme));
}
const hap = {
  tap(){ if (ver("6.1")) safe(()=>TG.HapticFeedback.impactOccurred("light")); },
  pick(){ if (ver("6.1")) safe(()=>TG.HapticFeedback.selectionChanged()); },
  ok(){ if (ver("6.1")) safe(()=>TG.HapticFeedback.notificationOccurred("success")); },
  err(){ if (ver("6.1")) safe(()=>TG.HapticFeedback.notificationOccurred("error")); }
};

/* ---------- данные: Supabase ---------- */
const PHOTO = p => `${CONFIG.SUPABASE_URL}/storage/v1/object/public/photos/${p}`;
async function rest(path, opts={}){
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    ...opts, headers: { apikey: CONFIG.SUPABASE_KEY, "content-type":"application/json", ...(opts.headers||{}) }
  });
  if (!r.ok) throw new Error("Не удалось загрузить данные");
  return r.status === 204 ? null : r.json();
}
async function api(action, body={}){
  if (!TG) throw new Error("Откройте приложение в Telegram, чтобы публиковать и сохранять объявления");
  const r = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/api`, {
    method: "POST",
    headers: { "content-type":"application/json", apikey: CONFIG.SUPABASE_KEY, "x-init-data": TG.initData },
    body: JSON.stringify({ action, ...body })
  });
  const data = await r.json().catch(()=>({ error: "Сервер не ответил" }));
  if (!r.ok || data.error) throw new Error(data.error || "Ошибка");
  return data;
}

const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/[ ,]/g," ");
function price(p, cur){
  if (!p) return "Даром";
  if (cur==="rub") return fmt(Math.round(p/S.rates.rub/10)*10)+" ₽";
  if (cur==="usdt") return fmt(Math.round(p/S.rates.usdt))+" USDT";
  return fmt(p)+" ₫";
}
const esc = s => String(s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function ago(iso){
  const m = Math.max(1, Math.round((Date.now()-new Date(iso).getTime())/60000));
  if (m < 60) return m+" мин";
  const h = Math.round(m/60); if (h < 24) return h+" ч";
  const d = Math.round(h/24); if (d === 1) return "вчера";
  if (d < 30) return d+" дн";
  return new Date(iso).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
}

const PAGE = 30;
function feedQuery(offset){
  const p = new URLSearchParams();
  p.set("select","*");
  p.set("status","in.(active,reserved)");
  p.set("city","eq."+S.city);
  if (S.cat!=="all") p.set("category","eq."+S.cat);
  const q = S.q.trim().replace(/[(),*%\\:."']/g," ").replace(/\s+/g," ").trim();
  if (q) p.set("or",`(title.ilike.*${q}*,description.ilike.*${q}*)`);
  p.set("order","bumped_at.desc");
  p.set("limit", String(PAGE)); p.set("offset", String(offset));
  return "listings?"+p.toString();
}
let feedSeq = 0;
async function loadFeed(append=false){
  if (!CONFIGURED) return;
  const seq = ++feedSeq;
  S.loading = true; S.err = ""; if (!append) { S.page = 0; } render();
  try {
    const rows = remember(await rest(feedQuery(append ? S.items.length : 0)));
    if (seq !== feedSeq) return;
    S.items = append ? S.items.concat(rows) : rows;
    S.more = rows.length === PAGE;
  } catch(e){ if (seq === feedSeq) S.err = e.message; }
  if (seq === feedSeq) { S.loading = false; render(); }
}
async function loadMovingCount(){
  if (!CONFIGURED) return;
  try {
    const rows = await rest(`listings?select=id&status=eq.active&moving_sale=is.true&city=eq.${encodeURIComponent(S.city)}&limit=200`);
    S.movingCount = rows.length; if (S.tab==="feed" && !S.sheet) render();
  } catch(e){}
}
async function loadSettings(){
  if (!CONFIGURED) return;
  try {
    const rows = await rest("app_settings?select=key,value");
    rows.forEach(r=>{
      if (r.key==="rates" && r.value.rub && r.value.usdt) S.rates = { rub:+r.value.rub, usdt:+r.value.usdt };
      if (r.key==="manager") S.manager = String(r.value.username||"").replace(/^@/,"");
    });
    if (!S.sheet) render();
  } catch(e){}
}
async function loadMe(){
  if (!TG || !CONFIGURED) return;
  try {
    const d = await api("me");
    S.me = d.user; S.admin = d.admin; S.fav = new Set(d.favs); S.mine = remember(d.mine);
    if (!S.sheet) render();
  } catch(e){ console.warn(e); }
}
async function getListing(id){
  if (S.cache.has(id)) return S.cache.get(id);
  const rows = await rest(`listings?select=*&id=eq.${id}`);
  if (!rows.length) throw new Error("Объявление снято или не найдено");
  return remember(rows)[0];
}

      <div class="upl">${S.photos.length<10?`<label for="f-ph">+ фото<input id="f-ph" type="file" accept="image/*" multiple></label>`:''}${pv}${'<div></div>'.repeat(slots)}</div></div>
    <div class="field"><label for="f-t">Что продаёте</label><input id="f-t" maxlength="120" placeholder="Например, Honda Vision 2020"></div>
    <div class="row2">
      <div class="field"><label for="f-c">Категория</label><select id="f-c">${CATS.slice(1).map(c=>`<option value="${c.id}">${c.n}</option>`).join("")}</select></div>
      <div class="field"><label for="f-city">Город</label><select id="f-city">${CITIES.map(c=>`<option ${c===S.city?'selected':''}>${c}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="f-d">Район</label><input id="f-d" list="f-dl" maxlength="60" placeholder="${dl[0]?'Например, '+dl[0]:'Район или ориентир'}"><datalist id="f-dl">${dl.map(d=>`<option value="${d}">`).join("")}</datalist></div>
    <div class="field" id="f-pw"><label for="f-p">Цена, ₫</label><input id="f-p" inputmode="numeric" placeholder="2 500 000"><span class="rate-note" id="f-conv">≈ 0 ₽ · 0 USDT по курсу обменника</span></div>
    <div class="field"><label for="f-s">Описание</label><textarea id="f-s" rows="4" maxlength="3000" placeholder="Состояние, комплект, где посмотреть"></textarea></div>
    <label class="toggle">Можно купить за рубли через обменник<input id="f-x" type="checkbox" checked></label>
    <label class="toggle">Это распродажа перед отъездом<input id="f-m" type="checkbox"></label>
    <p class="hint">Публикуя, вы соглашаетесь, что объявление честное: без обмана, оружия, лекарств и запрещённых товаров.</p>
    <button class="btn pri" id="publish">Опубликовать</button>
  </div>`;
}

function render(){
  const v={feed,fav:favs,post,swap,me}[S.tab]();
  document.getElementById("app").innerHTML=v;
  renderTabs();
  syncChrome();
  bindInputs();
}
let qTimer;
function bindInputs(){
  const q=document.getElementById("q");
  if(q){
    q.oninput=e=>{ S.q=e.target.value; clearTimeout(qTimer); qTimer=setTimeout(()=>{ const pos=q.selectionStart; loadFeed().then(()=>{ const n=document.getElementById("q"); if(n && document.activeElement!==n){ n.focus(); n.setSelectionRange(pos,pos);} }); }, 350); };
    q.onkeydown=e=>{ if(e.key==="Enter") e.target.blur(); };
  }
  const city=document.getElementById("city");
  if(city) city.onchange=e=>{ S.city=e.target.value; try{localStorage.setItem("city",S.city);}catch(_){} hap.pick(); loadFeed(); loadMovingCount(); };
  const fp=document.getElementById("f-p");
  if(fp) fp.oninput=e=>{ const v=+e.target.value.replace(/\D/g,""); e.target.value=v?fmt(v):""; document.getElementById("f-conv").textContent=`≈ ${fmt(Math.round(v/S.rates.rub))} ₽ · ${fmt(Math.round(v/S.rates.usdt))} USDT по курсу обменника`; markDirty(); };
  const fc=document.getElementById("f-c");
  if(fc) { const upd=()=>{ document.getElementById("f-pw").hidden = fc.value==="free"; }; fc.onchange=upd; upd(); }
  ["f-t","f-s","f-d"].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener("input", markDirty); });
  const ph=document.getElementById("f-ph");
  if(ph) ph.onchange=e=>{
    [...e.target.files].slice(0, 10-S.photos.length).forEach(f=>S.photos.push({file:f, url:URL.createObjectURL(f)}));
    hap.tap(); markDirty(); keepForm(render);
  };
}
function keepForm(fn){
  const ids=["f-t","f-c","f-city","f-d","f-p","f-s"], vals={}, checks={};
  ids.forEach(id=>{const el=document.getElementById(id); if(el) vals[id]=el.value;});
  ["f-x","f-m"].forEach(id=>{const el=document.getElementById(id); if(el) checks[id]=el.checked;});
  fn();
  ids.forEach(id=>{const el=document.getElementById(id); if(el && vals[id]!=null) el.value=vals[id];});
  Object.keys(checks).forEach(id=>{const el=document.getElementById(id); if(el) el.checked=checks[id];});
  const fc=document.getElementById("f-c"); if(fc) document.getElementById("f-pw").hidden = fc.value==="free";
}
function markDirty(){ if(!S.dirty){ S.dirty=true; if(ver("6.2")) safe(()=>TG.enableClosingConfirmation()); } }
function clearDirty(){ S.dirty=false; S.photos.forEach(p=>URL.revokeObjectURL(p.url)); S.photos=[]; if(ver("6.2")) safe(()=>TG.disableClosingConfirmation()); }

/* ---------- публикация ---------- */
function compress(file, max=1600, q=0.82){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = ()=>rej(new Error("Не удалось прочитать фото"));
    img.src = URL.createObjectURL(file);
  });
}
async function publish(){
  if (S.busy) return;
  const val = id => (document.getElementById(id)||{}).value||"";
  const title = val("f-t").trim();
  if (title.length < 3) { popup("Не хватает названия","Напишите, что продаёте — например, «Honda Vision 2020»."); return; }
  const category = val("f-c");
  const price_vnd = category==="free" ? 0 : +val("f-p").replace(/\D/g,"");
  if (category!=="free" && !price_vnd) { popup("Укажите цену","Напишите цену в донгах. Если отдаёте бесплатно, выберите категорию «Отдам даром»."); return; }
  if (!S.photos.length) { confirmAsk("Объявления без фото почти не смотрят. Опубликовать без фото?", ok=>{ if(ok) doPublish(); }); return; }
  doPublish();
}
async function doPublish(){
  const val = id => (document.getElementById(id)||{}).value||"";
  const form = {
    title: val("f-t").trim(), category: val("f-c"), city: val("f-city"), district: val("f-d").trim(),
    price_vnd: val("f-c")==="free" ? 0 : +val("f-p").replace(/\D/g,""), description: val("f-s").trim(),
    accepts_exchange: !!(document.getElementById("f-x")||{}).checked, moving_sale: !!(document.getElementById("f-m")||{}).checked
  };
  S.busy = true; mainProgress(true);
  const btn = document.getElementById("publish"); if (btn) { btn.disabled = true; btn.textContent = "Публикую…"; }
  try {
    const paths = [];
    for (let i=0; i<S.photos.length; i++){
      if (btn) btn.textContent = `Загружаю фото ${i+1} из ${S.photos.length}…`;
      if (TG) safe(()=>TG.MainButton.setText(`Фото ${i+1} из ${S.photos.length}…`));
      const data = await compress(S.photos[i].file);
      const r = await api("upload_photo", { data, type:"image/jpeg" });
      paths.push(r.path);
    }
    if (TG) safe(()=>TG.MainButton.setText("Публикую…"));
    const { listing } = await api("create_listing", { ...form, photos: paths });
    remember([listing]); S.mine.unshift(listing);
    hap.ok(); clearDirty();
    S.busy = false; mainProgress(false);
    if (listing.city === S.city) S.items.unshift(listing);
    S.tab = "me"; render(); window.scrollTo(0,0);
    popup("Опубликовано", "Объявление уже в ленте. Поделитесь им в чатах — так его увидят быстрее.",
      [{id:"share", type:"default", text:"Поделиться"},{type:"close"}], id=>{ if(id==="share") share(listing); askWrite(); });
  } catch(e){
    S.busy = false; mainProgress(false); if (TG) safe(()=>TG.MainButton.setText("Опубликовать"));
    if (btn) { btn.disabled = false; btn.textContent = "Опубликовать"; }
    errPopup(e);
  }
}
function askWrite(){
  if (!S.me || S.me.can_write || !ver("6.9")) return;
  safe(()=>TG.requestWriteAccess(ok=>{ if(ok){ S.me.can_write = true; api("write_access").catch(()=>{}); } }));
}

/* ---------- действия с объявлениями ---------- */
function myAction(act, id){
  const l = S.cache.get(id); if (!l) return;
  const run = async ()=>{
    try {
      const r = act==="bump" ? await api("bump",{id}) : await api("set_status",{id, status:act});
      hap.ok();
      if (act==="deleted") { S.mine = S.mine.filter(x=>x.id!==id); S.items = S.items.filter(x=>x.id!==id); S.cache.delete(id); }
      else { Object.assign(l, r.listing); }
      if (act==="sold") S.items = S.items.filter(x=>x.id!==id);
      toast({bump:"Поднято наверх ленты", reserved:"Отмечено как бронь", sold:"Отмечено как продано", active:"Снова в ленте", deleted:"Удалено"}[act]);
      if (S.sheet) closeSheet(); else render();
    } catch(e){ errPopup(e); }
  };
  if (act==="deleted") confirmAsk("Удалить объявление совсем? Фото тоже удалятся.", ok=>{ if(ok) run(); });
  else run();
}
function toggleFav(id){
  if (!TG) { popup("Избранное","Откройте приложение в Telegram, чтобы сохранять объявления."); return; }
  const on = !S.fav.has(id);
  on ? S.fav.add(id) : S.fav.delete(id);
  if (S.favItems) S.favItems = on ? (S.cache.get(id)?[S.cache.get(id)].concat(S.favItems):S.favItems) : S.favItems.filter(x=>x.id!==id);
  hap.tap(); if (!S.sheet) render(); else refreshSheetFav(id);
  api("fav",{id,on}).catch(e=>{ on ? S.fav.delete(id) : S.fav.add(id); errPopup(e); render(); });
}
function refreshSheetFav(id){
  const b = document.querySelector(".sheet [data-fav]"); if (!b) return;
  b.classList.toggle("on", S.fav.has(id)); b.textContent = S.fav.has(id) ? "♥ В избранном" : "♡ В избранное";
}
function writeSeller(l){
  if (l.seller_username) { openTg(`https://t.me/${l.seller_username}?text=${encodeURIComponent(`Здравствуйте! Пишу по объявлению «${l.title}» в Vietnam изнутри`)}`); return; }
  api("contact",{id:l.id}).then(r=>{
    if (r.ok) { hap.ok(); popup("Сообщение отправлено", "У продавца нет @username, поэтому бот передал ему ваш контакт. Он напишет вам в Telegram."); }
    else popup("Не получилось", "Продавец пока не открыл чат с ботом, поэтому бот не может ему написать. Попробуйте позже или выберите другое объявление.");
  }).catch(errPopup);
}
function buyViaExchange(l){
  if (!S.manager) { popup("Скоро", "Покупка за рубли через обменник скоро заработает."); return; }
  popup("Купить за рубли",
    `Вы платите ≈ ${price(l.price_vnd,"rub")} с российской карты. Продавец получит ${price(l.price_vnd,"vnd")} наличными от курьера после того, как вы осмотрите вещь.`,
    [{id:"go",type:"default",text:"Написать оператору"},{type:"cancel"}],
    id=>{ if(id==="go") openTg(`https://t.me/${S.manager}?text=${encodeURIComponent(`Хочу купить через обменник: «${l.title}», ${price(l.price_vnd,"vnd")}. ${itemLink(l.id)}`)}`); });
}
function report(l){
  popup("Пожаловаться", "Что не так с объявлением?",
    [{id:"Мошенничество или спам",type:"destructive",text:"Обман / спам"},{id:"Уже продано",type:"default",text:"Уже продано"},{id:"Запрещённый товар",type:"default",text:"Запрещёнка"}],
    id=>{ if(!id) return; api("report",{id:l.id, reason:id}).then(()=>{ hap.ok(); toast("Спасибо, модератор проверит"); }).catch(errPopup); });
}
function share(l){
  const text=`${l.title} — ${price(l.price_vnd,"vnd")}${l.price_vnd?` (≈ ${price(l.price_vnd,"rub")})`:''}\nVietnam изнутри`;
  const url=`https://t.me/share/url?url=${encodeURIComponent(itemLink(l.id))}&text=${encodeURIComponent(text)}`;
  hap.tap();
  if (TG) safe(()=>TG.openTelegramLink(url));
  else if (navigator.share) navigator.share({title:l.title,text,url:itemLink(l.id)}).catch(()=>{});
  else navigator.clipboard && navigator.clipboard.writeText(itemLink(l.id)).then(()=>toast("Ссылка скопирована"),()=>toast(itemLink(l.id)));
}

/* ---------- шторки ---------- */
function openSheet(html, key){
  S.sheet = key;
  document.getElementById("layer").innerHTML=`<div class="sheet-bg" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  syncChrome();
}
function closeSheet(){ S.sheet=null; document.getElementById("layer").innerHTML=""; render(); }

async function detail(id){
  let l;
  try { l = await getListing(id); } catch(e){ errPopup(e); return; }
  const mine = USER && l.seller_id === USER.id;
  const gallery = l.photos.length
    ? `<div class="gal">${l.photos.map(p=>`<img src="${PHOTO(p)}" alt="" loading="lazy">`).join("")}</div>${l.photos.length>1?`<div class="gal-n">${l.photos.length} фото · листайте</div>`:""}`
    : `<div class="big-ph" style="background:${TINT[l.category]||TINT.other}">${svg(l.category)}</div>`;
  const [st] = STATUS[l.status]||[""];
  openSheet(`
    <div class="sheet-top"><button class="icon-btn" data-share="${l.id}" aria-label="Поделиться">${ICO_SHARE}</button><button class="icon-btn x" data-close="1" aria-label="Закрыть">✕</button></div>
    ${gallery}
    <div class="d-h"><h3>${esc(l.title)}</h3>
      <div class="conv"><b>${price(l.price_vnd,"vnd")}</b>${l.price_vnd?`<span>≈ ${price(l.price_vnd,"rub")}</span><span>≈ ${price(l.price_vnd,"usdt")}</span>`:''}</div>
      ${l.status!=="active"?`<span class="pill">${st}</span>`:""}
    </div>
    <div class="box"><dl class="kv"><dt>Категория</dt><dd>${CAT_NAME[l.category]||""}</dd><dt>Где</dt><dd>${esc(l.city)}${l.district?", "+esc(l.district):""}</dd><dt>Опубликовано</dt><dd>${ago(l.created_at)} назад</dd><dt>Просмотров</dt><dd>${l.views}</dd></dl>
      ${l.description?`<p class="desc">${esc(l.description)}</p>`:""}</div>
    <div class="box seller"><span class="ava">${esc((l.seller_name||"?")[0])}</span><span><b>${esc(l.seller_name||"Продавец")}</b><small>${l.seller_username?"@"+esc(l.seller_username)+" · ":""}<span class="verified">✓ Telegram</span></small></span></div>
    ${l.accepts_exchange && l.price_vnd && !mine?`<div class="box safe"><h4>Можно купить за рубли</h4><p>Заплатите ≈ ${price(l.price_vnd,"rub")} с российской карты — продавец получит донги от курьера после осмотра вещи.</p></div>`:""}
    ${mine ? `<div class="form acts-big">
        ${l.status==="active"?`<button class="btn sec" data-act="bump" data-id="${l.id}">Поднять</button><button class="btn sec" data-act="reserved" data-id="${l.id}">Бронь</button>`:""}
        ${l.status==="reserved"||l.status==="sold"?`<button class="btn sec" data-act="active" data-id="${l.id}">Вернуть в ленту</button>`:""}
        ${l.status!=="sold"&&l.status!=="hidden"?`<button class="btn sec" data-act="sold" data-id="${l.id}">Продано</button>`:""}
        <button class="btn sec" data-act="deleted" data-id="${l.id}">Удалить</button></div>`
      : `<div class="form row-links"><button class="link fav-link ${S.fav.has(l.id)?"on":""}" data-fav="${l.id}">${S.fav.has(l.id)?"♥ В избранном":"♡ В избранное"}</button><button class="link" data-report="${l.id}">Пожаловаться</button></div>
         <div class="actions"><button class="btn sec" data-write="${l.id}">Написать</button>${l.accepts_exchange&&l.price_vnd?`<button class="btn pri" data-buy="${l.id}">Купить за ₽</button>`:""}</div>`}
  `, "item");
  if (mine) { setMain(null); setSecond(null); }
  else {
    setMain(l.seller_username ? "Написать продавцу" : "Связаться с продавцом", ()=>writeSeller(l));
    if (l.accepts_exchange && l.price_vnd) setSecond(`Купить за ${price(l.price_vnd,"rub")}`, ()=>buyViaExchange(l)); else setSecond(null);
    if (TG && !ver("7.10") && l.accepts_exchange && l.price_vnd) { const a=document.querySelector(".sheet .actions"); if(a) a.style.display="flex"; }
  }
  if (CONFIGURED) rest("rpc/add_view",{method:"POST", body:JSON.stringify({p_id:l.id})}).catch(()=>{});
}
async function moving(){
  openSheet(`<div class="sheet-top"><span></span><button class="icon-btn x" data-close="1" aria-label="Закрыть">✕</button></div>
    <div class="d-h"><h3>Уезжаю — продаю всё</h3><p class="meta" style="margin:6px 0 0">${esc(S.city)} · распродажи перед переездом</p></div><div id="mv" class="empty">Загружаю…</div>`, "moving");
  setMain(null); setSecond(null);
  try {
    const rows = remember(await rest(`listings?select=*&status=in.(active,reserved)&moving_sale=is.true&city=eq.${encodeURIComponent(S.city)}&order=seller_id,bumped_at.desc&limit=200`));
    const by = {}; rows.forEach(l=>{ (by[l.seller_id] = by[l.seller_id] || []).push(l); });
    const html = Object.values(by).map(g=>`<div class="sec-h"><h2>${esc(g[0].seller_name||"Продавец")}</h2><span>${g.length} вещ. · ${price(g.reduce((a,l)=>a+l.price_vnd,0),"vnd")}</span></div>
      <div class="list">${g.map(l=>`<button class="li" data-open="${l.id}">${thumb(l,"mini")}</div><span class="t"><b>${esc(l.title)}</b><small>${price(l.price_vnd,"vnd")}</small></span></button>`).join("")}</div>`).join("");
    const box = document.getElementById("mv"); if (box) box.outerHTML = html || `<div class="empty">Сейчас распродаж нет.</div>`;
  } catch(e){ const box=document.getElementById("mv"); if(box) box.textContent = e.message; }
}

/* ---------- события ---------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-tab],[data-cat],[data-cur],[data-open],[data-fav],[data-close],[data-moving],[data-share],[data-rmph],[data-act],[data-write],[data-buy],[data-report],[data-more],[data-reload],[data-manager],#publish");
  if(!t || t.disabled) return;
  const d=t.dataset;
  if(d.fav){ e.stopPropagation(); toggleFav(+d.fav); return; }
  if(d.act){ e.stopPropagation(); myAction(d.act, +d.id); return; }
  if(d.tab){
    if(S.tab===d.tab && !S.sheet) return;
    S.tab=d.tab; S.sheet=null; document.getElementById("layer").innerHTML=""; hap.pick(); render(); window.scrollTo(0,0);
    if(S.tab==="fav" && TG) api("favs").then(r=>{ S.favItems = remember(r.listings); if(S.tab==="fav"&&!S.sheet) render(); }).catch(errPopup);
    if(S.tab==="me") loadMe();
    return;
  }
  if(d.cat){ S.cat=d.cat; hap.pick(); loadFeed(); return; }
  if(d.cur){ S.cur=d.cur; hap.pick(); render(); return; }
  if(d.open){ hap.tap(); detail(+d.open); return; }
  if(d.close){ closeSheet(); return; }
  if(d.moving){ hap.tap(); moving(); return; }
  if(d.share){ getListing(+d.share).then(share).catch(errPopup); return; }
  if(d.write){ getListing(+d.write).then(writeSeller).catch(errPopup); return; }
  if(d.buy){ getListing(+d.buy).then(buyViaExchange).catch(errPopup); return; }
  if(d.report){ getListing(+d.report).then(report).catch(errPopup); return; }
  if(d.more){ loadFeed(true); return; }
  if(d.reload){ loadFeed(); return; }
  if(d.manager){ if(S.manager) openTg(`https://t.me/${S.manager}?text=${encodeURIComponent("Здравствуйте! Хочу обменять рубли на донги")}`); return; }
  if(t.matches("[data-rmph]")){ e.preventDefault(); const p=S.photos.splice(+d.rmph,1)[0]; if(p) URL.revokeObjectURL(p.url); keepForm(render); return; }
  if(t.id==="publish"){ publish(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") goBack(); });

/* ---------- запуск ---------- */
render();
loadSettings(); loadFeed(); loadMovingCount(); loadMe();
const start = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || location.hash.slice(1);
const m = /^item_(\d+)$/.exec(start||"");
if (m && CONFIGURED) detail(+m[1]);
