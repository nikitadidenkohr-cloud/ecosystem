<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Vietnam изнутри — объявления, сервисы и всё для жизни во Вьетнаме">
<meta name="theme-color" content="#2C3E2D">
<title>Vietnam изнутри</title>
<!-- Telegram Mini App SDK: должен стоять первым скриптом -->
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: одна колонка шириной телефона, нижняя панель вкладок, карточки товаров сеткой 2×N, детали открываются шторкой снизу */
:root{
  --bg:#F3F5EC; --surface:#FFFFFF; --surface-2:#E8ECDD; --fg:#1C2A1E; --muted:#5F6C5F;
  --brand:#2C3E2D; --lime:#D6EB4F; --lime-ink:#1C2A1E; --line:#D9DFCB; --danger:#B4452F; --ok:#2F7A44;
  --ad:#FFF6D6; --ad-line:#EADBA0;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141C15; --surface:#1E2A1F; --surface-2:#273628; --fg:#ECF1E2; --muted:#9DAA9B;
  --brand:#2C3E2D; --lime:#D6EB4F; --lime-ink:#1C2A1E; --line:#304130; --danger:#E07A63; --ok:#7CC48F;
  --ad:#2E2C1C; --ad-line:#4A4528; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141C15; --surface:#1E2A1F; --surface-2:#273628; --fg:#ECF1E2; --muted:#9DAA9B;
  --brand:#2C3E2D; --lime:#D6EB4F; --lime-ink:#1C2A1E; --line:#304130; --danger:#E07A63; --ok:#7CC48F;
  --ad:#2E2C1C; --ad-line:#4A4528; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));position:relative}
.wrap{padding-inline:16px}

/* шапка */
.top{background:var(--brand);color:#ECF1E2;padding:14px 16px 18px;border-radius:0 0 22px 22px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--lime);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.city{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:7px 11px;border-radius:999px;font-weight:700;font-size:13px;color:#ECF1E2}
.city select{background:transparent;border:0;color:inherit;font:inherit;appearance:none;padding-right:2px}
.city select option{color:#1C2A1E}
.search{margin-top:14px;display:flex;gap:8px}
.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:12px 14px;font:inherit;background:#ECF1E2;color:#1C2A1E}
.cur{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.cur button{padding:0 10px;border-radius:9px;font-weight:800;font-size:13px;color:#ECF1E2}
.cur button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}

/* чипы категорий */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* баннер переезда */
.moving{margin:12px 16px 4px;display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--lime);color:var(--lime-ink);text-align:left;width:calc(100% - 32px)}
.moving b{font-family:var(--f-display);font-size:14px;font-weight:700;display:block;line-height:1.2}
.moving span{font-size:13px;font-weight:600}
.moving .n{margin-left:auto;font-family:var(--f-display);font-size:22px;font-weight:700}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 16px 8px}
.sec-h h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0}
.sec-h span{color:var(--muted);font-size:13px;font-weight:600}

/* сетка товаров */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-inline:16px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;min-width:0}
.ph{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;position:relative}
.ph svg{width:46%;height:46%}
.badge{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--lime);color:var(--lime-ink)}
.badge.res{background:#1C2A1E;color:#ECF1E2}
.fav{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center}
.fav svg{width:17px;height:17px}
.card-b{padding:9px 10px 11px;display:grid;gap:2px;min-width:0}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.title{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--muted)}
.card.vip{outline:2px solid var(--lime);outline-offset:-2px}

/* рекламная карточка */
.ad{grid-column:1/-1;background:var(--ad);border:1px solid var(--ad-line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;text-align:left}
.ad .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--brand);display:grid;place-items:center}
.ad .ic svg{width:26px;height:26px}
.ad b{display:block;font-size:14px}
.ad p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ad .tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* нижние вкладки */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:64px;align-items:center}
.tab{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--fg)}
.tab.plus span{width:46px;height:46px;border-radius:15px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}

/* шторка */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,10,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:480px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;z-index:2}
.big-ph{aspect-ratio:4/3;max-width:100%;margin:12px 16px 0;border-radius:var(--r);display:grid;place-items:center;position:relative}
.big-ph svg{width:34%;height:34%}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}.dots i:first-child{background:#fff}
.d-h{padding:14px 16px 0}
.d-h h3{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
.conv{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-variant-numeric:tabular-nums}
.conv b{font-size:22px}
.conv span{color:var(--muted);font-weight:700;font-size:14px;align-self:flex-end;padding-bottom:3px}
.rate-note{font-size:12px;color:var(--muted);margin-top:4px}
.box{margin:12px 16px 0;background:var(--surface);border-radius:var(--r);padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.seller{display:flex;gap:12px;align-items:center}
.ava{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--lime);font-family:var(--f-display);font-weight:700;display:grid;place-items:center;flex:none}
.seller b{display:block}.seller small{color:var(--muted);font-size:13px}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ok)}
.safe{background:var(--brand);color:#ECF1E2}
.safe h4{margin:0;font-family:var(--f-display);font-size:14px;color:var(--lime)}
.safe p{margin:6px 0 10px;font-size:13px;opacity:.9}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;font-weight:600}
.steps div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px}
.steps div b{display:block;color:var(--lime);font-size:13px}
.actions{position:sticky;bottom:0;display:flex;gap:8px;padding:14px 16px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:15px;text-align:center}
.btn.pri{background:var(--lime);color:var(--lime-ink)}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.btn.dark{background:var(--fg);color:var(--bg)}

/* формы */
.form{display:grid;gap:14px;padding:16px}
.form h2{font-family:var(--f-display);font-size:18px;margin:0}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px;font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.upl div{aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:22px}
.upl div:first-child{background:var(--surface-2);border-style:solid;font-size:12px;font-weight:700;text-align:center;padding:4px}
.ai{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px}
.ai b{display:block;font-size:14px}
.ai .spark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--lime);display:grid;place-items:center;color:var(--lime-ink);font-weight:800}
.boosts{display:grid;gap:8px}
.boost{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.boost[aria-pressed="true"]{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.boost b{display:block;font-size:14px}.boost small{color:var(--muted);font-size:12px}
.boost .p{margin-left:auto;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}

/* профиль */
.p-head{display:flex;gap:14px;align-items:center;padding:16px}
.p-head .ava{width:58px;height:58px;font-size:20px}
.p-head h2{margin:0;font-family:var(--f-display);font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-inline:16px}
.stats div{background:var(--surface);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px;font-weight:600}
.list{display:grid;gap:8px;padding-inline:16px}
.li{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px;text-align:left;width:100%}
.li .mini{width:54px;height:54px;border-radius:10px;flex:none;display:grid;place-items:center}
.li .mini svg{width:55%;height:55%}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;background:var(--surface-2);white-space:nowrap}
.pill.on{background:var(--lime);color:var(--lime-ink)}
.saved{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px}
.saved b{display:block;font-size:14px}.saved small{color:var(--muted);font-size:12px}
.saved .bell{margin-left:auto;font-size:12px;font-weight:800;color:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.feat{display:grid;gap:10px;padding:0 16px}
.feat div{background:var(--surface);border-radius:14px;padding:12px 14px}
.feat b{display:block;font-size:14px}.feat p{margin:3px 0 0;font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.proto{font-size:11px;text-align:center;color:var(--muted);padding:18px 16px 6px}

/* ---- Telegram-версия ---- */
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.top{padding-top:calc(14px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.tabs{padding-bottom:max(env(safe-area-inset-bottom,0px), var(--tg-safe-area-inset-bottom,0px))}
.in-tg .actions, .in-tg #publish{display:none}
.in-tg .app{padding-bottom:calc(76px + var(--tg-safe-area-inset-bottom,0px))}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 0}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:19px;height:19px}
.sheet .x{position:static}
.upl label,.upl .pv{aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;overflow:hidden;position:relative}
.upl label{background:var(--surface-2);border:1.5px dashed var(--line);color:var(--muted);font-size:12px;font-weight:700;text-align:center;padding:4px;cursor:pointer}
.upl .pv img{width:100%;height:100%;object-fit:cover}
.upl .pv button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.hint{font-size:12px;color:var(--muted)}
.demo{display:inline-block;margin-left:6px;font-family:var(--f-body);font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:var(--lime);color:var(--lime-ink);vertical-align:middle}
.p-head .ava img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.upl .pv{border:0;background:var(--surface-2)}

/* всё строго в ширину экрана */
html,body{max-width:100%;overflow-x:hidden}
.list,.feat,.boosts{grid-template-columns:minmax(0,1fr)}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.li,.saved,.boost{min-width:0;max-width:100%}
.saved>span,.boost>span:first-child{min-width:0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Разделы"><div class="tabs-in" id="tabs"></div></nav>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* =====================================================================
   НАСТРОЙКИ — заполнить после создания бота в BotFather
   ===================================================================== */
const CONFIG = {
  BOT_USERNAME: "vietnam_iznutri_bot", // бот бренда (без @)
  APP_SHORTNAME: "app",                // короткое имя mini app из /newapp в BotFather
  MANAGER_USERNAME: "",      // username оператора обменника (без @) — куда ведёт «Купить за ₽» в демо
  RATE: { rub: 305, usdt: 26300 } // ₫ за 1 ₽ и за 1 USDT — пример, в рабочей версии берётся из таблицы обменника
};

/* ---------- Telegram SDK ---------- */
const TG = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;
const ver = v => !!(TG && TG.isVersionAtLeast && TG.isVersionAtLeast(v));
const safe = fn => { try { fn(); } catch (e) {} };
const USER = TG && TG.initDataUnsafe && TG.initDataUnsafe.user || null;

function applyTheme(){
  if (TG) document.documentElement.dataset.theme = TG.colorScheme === "dark" ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#F3F5EC";
  if (ver("6.1")) safe(()=>{ TG.setHeaderColor("#2C3E2D"); TG.setBackgroundColor(bg); });
  if (ver("7.10")) safe(()=>TG.setBottomBarColor(bg));
}
if (TG) {
  document.documentElement.classList.add("in-tg");
  safe(()=>TG.ready());
  safe(()=>TG.expand());
  if (ver("7.7")) safe(()=>TG.disableVerticalSwipes());
  applyTheme();
  safe(()=>TG.onEvent("themeChanged", applyTheme));
}
const hap = {
  tap(){ if (ver("6.1")) safe(()=>TG.HapticFeedback.impactOccurred("light")); },
  pick(){ if (ver("6.1")) safe(()=>TG.HapticFeedback.selectionChanged()); },
  ok(){ if (ver("6.1")) safe(()=>TG.HapticFeedback.notificationOccurred("success")); }
};

/* ---------- хранилище избранного: CloudStorage в Telegram, localStorage в браузере ---------- */
const store = {
  get(key, cb){
    if (ver("6.9")) { safe(()=>TG.CloudStorage.getItem(key, (err, v)=>cb(err ? null : v))); return; }
    let v = null; try { v = localStorage.getItem(key); } catch(e) {}
    cb(v);
  },
  set(key, val){
    if (ver("6.9")) { safe(()=>TG.CloudStorage.setItem(key, val)); return; }
    try { localStorage.setItem(key, val); } catch(e) {}
  }
};

/* ---------- данные-примеры ---------- */
const RATE = CONFIG.RATE;
const CATS = [
  {id:"all", n:"Всё"},{id:"bike", n:"Байки"},{id:"home", n:"Для дома"},{id:"tech", n:"Техника"},
  {id:"kids", n:"Детям"},{id:"sport", n:"Спорт и сёрф"},{id:"rent", n:"Жильё"},{id:"free", n:"Отдам даром"}
];
const ICON = {
  bike:'<path d="M5 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm14 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8 14h5l3-5h2M13 14l-3-6H7"/>',
  home:'<path d="M3 11h18v6H3zM5 17v3m14-3v3M5 11V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/>',
  tech:'<path d="M3 5h18v11H3zM8 20h8m-4-4v4"/>',
  kids:'<path d="M4 11h11a5 5 0 0 1-5 5H8a4 4 0 0 1-4-4v-1Zm11 0V6l4-2M7 19a1.5 1.5 0 1 0 0 .1M14 19a1.5 1.5 0 1 0 0 .1"/>',
  sport:'<path d="M12 2c3 4 4 10 0 20C8 12 9 6 12 2Zm0 6v8"/>',
  rent:'<path d="M3 11 12 4l9 7v9H3zM9 20v-6h6v6"/>',
  free:'<path d="M4 10h16v10H4zM3 7h18v3H3zm9 0v13M12 7c-2-4-6-3-5 0m5 0c2-4 6-3 5 0"/>'

  const ids=["f-t","f-c","f-d","f-p","f-s"], vals={}, checks={};

  ["f-x","f-m"].forEach(id=>{const el=document.getElementById(id); if(el) checks[id]=el.checked;});
  fn();
  ids.forEach(id=>{const el=document.getElementById(id); if(el && vals[id]!=null) el.value=vals[id];});
  Object.keys(checks).forEach(id=>{const el=document.getElementById(id); if(el) el.checked=checks[id];});
}
function markDirty(){ if(!S.dirty){ S.dirty=true; if(ver("6.2")) safe(()=>TG.enableClosingConfirmation()); } }
function clearDirty(){ S.dirty=false; S.photos=[]; if(ver("6.2")) safe(()=>TG.disableClosingConfirmation()); }

function publish(){
  const t=(document.getElementById("f-t")||{}).value||"";
  if(!t.trim()){ popup("Не хватает названия","Напишите, что продаёте — например, «Honda Vision 2020».",[{type:"ok"}]); document.getElementById("f-t").focus(); return; }
  const paid = S.boost!=="none";
  popup("Объявление готово",
    paid ? "В рабочей версии здесь откроется оплата продвижения через Telegram Stars или обменник. Сейчас это демо — ничего не списывается."
         : "В рабочей версии объявление уйдёт на модерацию и появится в ленте. Сейчас это демо — оно никуда не отправится.",
    [{type:"ok"}], ()=>{ hap.ok(); clearDirty(); S.boost="none"; S.tab="me"; render(); window.scrollTo(0,0); });
}

/* ---------- шторки ---------- */
function openSheet(html, key){
  S.sheet = key;
  document.getElementById("layer").innerHTML=`<div class="sheet-bg" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  syncChrome();
}
function closeSheet(){
  S.sheet=null;
  document.getElementById("layer").innerHTML="";
  render();
}

function buyViaExchange(it){
  popup("Купить через обменник",
    `Вы платите ${price(it.p,"rub")} с российской карты. Продавец получит ${price(it.p,"vnd")} наличными от курьера после того, как вы осмотрите вещь.`,
    [{id:"go",type:"default",text:"Оставить заявку"},{type:"cancel"}],
    id=>{ if(id!=="go") return;
      if(CONFIG.MANAGER_USERNAME){ openTg(CONFIG.MANAGER_USERNAME); }
      else { hap.ok(); toast("Демо: заявка ушла бы оператору обменника"); } });
}
function writeSeller(name){
  popup("Написать продавцу", `В рабочей версии откроется личный чат с ${name} в Telegram. В демо у продавцов нет настоящих аккаунтов.`, [{type:"ok"}]);
}
function share(it){
  const link=itemLink(it.id);
  const text=`${it.t} — ${price(it.p,"vnd")}${it.p?` (≈ ${price(it.p,"rub")})`:''}\nVietnam изнутри`;
  const url=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
  hap.tap();
  if (TG) safe(()=>TG.openTelegramLink(url));
  else if (navigator.share) navigator.share({title:it.t,text,url:link}).catch(()=>{});
  else { navigator.clipboard && navigator.clipboard.writeText(link).then(()=>toast("Ссылка скопирована"),()=>toast(link)); }
}

function detail(id){
  const it=ITEMS.find(i=>i.id===id); if(!it) return;
  openSheet(`
    <div class="sheet-top"><button class="icon-btn" data-share="${it.id}" aria-label="Поделиться">${ICO_SHARE}</button><button class="icon-btn x" data-close="1" aria-label="Закрыть">✕</button></div>
    <div class="big-ph" style="background:${TINT[it.c]}">${svg(it.c)}<div class="dots"><i></i><i></i><i></i><i></i></div></div>
    <div class="d-h"><h3>${esc(it.t)}</h3>
      <div class="conv"><b>${price(it.p,"vnd")}</b>${it.p?`<span>≈ ${price(it.p,"rub")}</span><span>≈ ${price(it.p,"usdt")}</span>`:''}</div>
      ${it.p?`<div class="rate-note">Пересчёт по курсу обменника Vietnam изнутри на сегодня</div>`:''}
    </div>
    <div class="box"><dl class="kv"><dt>Состояние</dt><dd>${it.cond}</dd><dt>Район</dt><dd>${it.d}, ${S.city}</dd><dt>Опубликовано</dt><dd>${it.ago} назад</dd></dl>
      <p style="margin:12px 0 0;font-size:14px">${esc(it.desc)}</p></div>
    <div class="box seller"><span class="ava">${it.s[0]}</span><span><b>${it.s}</b><small>★ ${String(it.sr).replace(".",",")} · ${it.sd} сделок · <span class="verified">✓ Telegram</span></small></span></div>
    ${it.p?`<div class="box safe"><h4>Купить через обменник</h4><p>Заплатите ${price(it.p,"rub")} с российской карты. Продавец получит ${price(it.p,"vnd")} наличными от нашего курьера после того, как вы осмотрите вещь.</p>
      <div class="steps"><div><b>1</b>Вы платите ₽</div><div><b>2</b>Осмотр вещи</div><div><b>3</b>Продавцу ₫</div></div></div>`:''}
    <div class="actions">
      <button class="btn sec" data-msg="${it.s}">Написать</button>
      ${it.p?`<button class="btn pri" data-safe="${it.id}">Купить за ₽</button>`:`<button class="btn pri" data-msg="${it.s}">Забрать</button>`}
    </div>`, "item");
  if (it.p) { setMain(`Купить за ${price(it.p,"rub")}`, ()=>buyViaExchange(it)); setSecond("Написать", ()=>writeSeller(it.s)); }
  else { setMain("Забрать", ()=>writeSeller(it.s)); setSecond(null); }
  // без SecondaryButton (старый Telegram) — оставляем кнопку «Написать» в шторке
  if (TG && !ver("7.10")) document.querySelector(".sheet .actions").style.display="flex";
}
function moving(){
  const pack=[ITEMS[1],ITEMS[2],ITEMS[7],ITEMS[10]];
  const sum=pack.reduce((a,b)=>a+b.p,0);
  const deal=Math.round(sum*0.8/10000)*10000;
  openSheet(`<div class="sheet-top"><span></span><button class="icon-btn x" data-close="1" aria-label="Закрыть">✕</button></div>
    <div class="d-h"><h3>Уезжаю — продаю всё</h3><p class="meta" style="margin:6px 0 0">Ирина, Хай Чау · улетаю 14 октября</p></div>
    <div class="box"><dl class="kv"><dt>Вещей</dt><dd>${pack.length}</dd><dt>По отдельности</dt><dd>${price(sum,"vnd")}</dd><dt>Всё вместе</dt><dd style="color:var(--ok)">${price(deal,"vnd")} (−20%)</dd></dl></div>
    <div class="sec-h"><h2>Что продаётся</h2></div>
    <div class="list">${pack.map(it=>`<button class="li" data-open="${it.id}"><span class="mini" style="background:${TINT[it.c]}">${svg(it.c)}</span><span class="t"><b>${esc(it.t)}</b><small>${price(it.p,"vnd")}</small></span></button>`).join("")}</div>
    <div class="actions"><button class="btn pri" data-msg="Ириной">Забрать всё за −20%</button></div>`, "moving");
  setMain("Забрать всё за −20%", ()=>writeSeller("Ириной")); setSecond(null);
}

/* ---------- события ---------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-tab],[data-cat],[data-cur],[data-open],[data-fav],[data-close],[data-moving],[data-msg],[data-safe],[data-ad],[data-pick],[data-boost],[data-savesearch],[data-share],[data-rmph],#publish");
  if(!t) return;
  if(t.dataset.fav){ e.stopPropagation(); const id=+t.dataset.fav; S.fav.has(id)?S.fav.delete(id):S.fav.add(id); saveFav(); hap.tap(); render(); return; }
  if(t.dataset.tab){ if(S.tab===t.dataset.tab && !S.sheet) return; S.tab=t.dataset.tab; S.sheet=null; document.getElementById("layer").innerHTML=""; hap.pick(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.cat){ S.cat=t.dataset.cat; hap.pick(); render(); return; }
  if(t.dataset.cur){ S.cur=t.dataset.cur; hap.pick(); render(); return; }
  if(t.dataset.open){ hap.tap(); detail(+t.dataset.open); return; }
  if(t.dataset.close){ closeSheet(); return; }
  if(t.dataset.moving){ hap.tap(); moving(); return; }
  if(t.dataset.share){ share(ITEMS.find(i=>i.id===+t.dataset.share)); return; }
  if(t.dataset.msg){ writeSeller(t.dataset.msg); return; }
  if(t.dataset.safe){ buyViaExchange(ITEMS.find(i=>i.id===+t.dataset.safe)); return; }
  if(t.dataset.ad){ popup("Реклама", "В рабочей версии здесь откроется канал или чат рекламодателя, а клик засчитается в статистику.", [{type:"ok"}]); return; }
  if(t.dataset.pick){ S.boost=t.dataset.pick; hap.pick(); keepForm(render); return; }
  if(t.matches("[data-rmph]")){ e.preventDefault(); S.photos.splice(+t.dataset.rmph,1); keepForm(render); return; }
  if(t.dataset.boost){ S.tab="post"; S.boost="vip"; render(); window.scrollTo(0,document.body.scrollHeight); return; }
  if(t.dataset.savesearch){ hap.ok(); toast("Поиск сохранён, бот напишет о новых объявлениях"); return; }
  if(t.id==="publish"){ publish(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") goBack(); });

/* ---------- запуск: открыть объявление по ссылке ---------- */
render();
const start = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || location.hash.slice(1);
const m = /^item_(\d+)$/.exec(start||"");
if (m) detail(+m[1]);
</script>
</body>
</html>
